aid: synapsefi
name: Synapse
description: >-
  Synapse Financial Technologies was a San Francisco banking-as-a-service platform, founded
  2014-04-14 by Sankaet Pathak and Bryan Keltner, that sold a REST API letting fintech companies
  open and operate deposit accounts, move money over ACH and wires, issue cards and run KYC/CIP
  checks through partner banks including Evolve Bank & Trust, AMG National Trust, American Bank
  North America and Lineage Bank. At its peak it served roughly 100 fintech platforms reaching
  about 10 million end customers, and it published first-party client libraries for Node.js,
  Python, Ruby, Go and PHP against its v3.1 REST API. Synapse filed for Chapter 11 bankruptcy on
  2024-04-22 with a $65-96 million shortfall between its records and its partner banks'; the sale
  of its technology assets drew no qualified bids and the case was later dismissed. The company is
  defunct: as of 2026-08-29 every synapsefi.com host returns NXDOMAIN, so the API, its
  documentation and its developer portal are all permanently unreachable. This profile records
  what survives — the first-party SDKs still published on npm, PyPI, RubyGems and the Go module
  proxy, and the public GitHub organization.
