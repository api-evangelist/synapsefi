    license: MIT
    repository: https://github.com/SynapseFI/SynapseNode
    description: Node.js client library for the SynapseFI REST v3.1 API.
    note: >-
      Newest first-party release in any registry. Latest dist-tag is still a beta
      (2.0.0-beta.11); no stable 2.x was ever cut.

  - name: synapsepay
