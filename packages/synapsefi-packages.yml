---
name: Synapse — Client Libraries and Packages
slug: synapsefi
type: Packages
generated: '2026-08-29'
method: searched
source: >-
  Registry metadata read unauthenticated from registry.npmjs.org, pypi.org/pypi/<pkg>/json,
  rubygems.org/api/v1/gems/<pkg>.json and proxy.golang.org, plus the first-party GitHub
  organization https://github.com/SynapseFI (HTTP 200, 11 public repositories).
note: >-
  Synapse Financial Technologies is defunct — it filed Chapter 11 on 2024-04-22 and the case was
  later dismissed/converted after the asset sale to TabaPay collapsed and no qualified bids were
  received. Every synapsefi.com host (synapsefi.com, api.synapsefi.com, docs.synapsefi.com,
  help.synapsefi.com) now fails DNS resolution (NXDOMAIN, probed 2026-08-29), so the API these
  packages wrap is no longer reachable. The packages themselves remain published on their public
  registries and are recorded here as the surviving first-party evidence of the API surface.
  ABANDONMENT SIGNAL: the newest first-party release in any registry is 2023-06-28 (npm
  synapsenode 2.0.0-beta.11) — more than three years old, and still a pre-release beta.
ownership_check: >-
  All npm packages below are published by Synapse-owned maintainer accounts
  (pchen_synapsefi, synapse_frontend, sean_synapsefi, japamat_synapse, nicklassynapse,
  tynasynapse, synapsepay); the PyPI, RubyGems and Go modules resolve to the
  github.com/SynapseFI and github.com/synapsepay organizations (SynapsePay was the company's
  earlier brand). No third-party fork is marked official.

packages:

