    downloads: 10440
    note: >-
      Only ever released as 1.0.0. The SynapseFI/SynapseFI-Ruby repository was last pushed
      2022-07-21, three and a half years after the single gem release.

  - name: github.com/SynapseFI/SynapseGo
    registry: go
    url: https://pkg.go.dev/github.com/SynapseFI/SynapseGo
    language: Go
    official: true
