    published: '2023-01-09'
    repository: https://github.com/SynapseFI/SynapseGo
    description: Go wrapper for the Synapse REST API.
    note: >-
      Pseudo-version only — the module was never tagged with a semantic version, so consumers
      pin a commit hash rather than a release.

  - name: SynapsePHP
    registry: github
    url: https://github.com/SynapseFI/SynapsePHP
    language: PHP
    official: true
    version: null
    published: null
