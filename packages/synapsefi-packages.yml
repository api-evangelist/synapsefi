    description: Legacy Python client for the SynapsePay REST API.
    note: Superseded by synapsepy; retained for provenance of the SynapsePay-era surface.

  - name: synapsepay
    registry: pypi
    url: https://pypi.org/project/synapsepay/
    language: Python
    official: true
    version: 0.0.6
    published: '2015-06-11'
    repository: null
    description: Earliest published Python client, targeting api.synapsepay.com v2.0.
    note: >-
      home_page in the registry metadata is http://api.synapsepay.com/v2.0 — a base URL that no
      longer resolves.

  - name: synapse_pay_rest
    registry: rubygems
